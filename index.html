<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap');
:root{
  --accent:#E91E63; --accent-hover:#D81B60; --accent-ink:#fff;
  --lime:#D4FF00; --lime-ink:#0A0A0A; --blue:#3D47FF;
  --font-sans:'Archivo',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,"SF Mono",Menlo,monospace;
  --r-pill:99px; --r-card:14px; --r-md:10px; --r-sm:7px;
  --shadow:0 1px 3px rgba(0,0,0,.18),0 12px 32px rgba(0,0,0,.14);
  --bg:#0D0D09; --surface:#15150F; --surface-2:#1C1C14;
  --ink:#FAFAF7; --ink-soft:#C5C5BC; --muted:#8A8A80;
  --line:#26261A; --line-2:#33332A; --grid:rgba(255,255,255,.045);
  --accent-soft:rgba(233,30,99,.16); --lime-soft:rgba(212,255,0,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;color:var(--ink);background:var(--bg);font:16px/1.5 var(--font-sans);
  -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(var(--grid) 1px,transparent 1px);background-size:22px 22px;
  min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:rgba(13,13,9,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:12px 18px}
.topin{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:14px}
.logo{cursor:pointer;font-weight:800;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.logo .sq{width:8px;height:8px;background:var(--accent);display:inline-block;margin:0 3px;border-radius:1px}
.bar{flex:1;height:5px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.cnt{font:600 11px var(--font-mono);color:var(--muted);white-space:nowrap}
main{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:34px 18px 120px}
.screen{max-width:680px;width:100%}
.kicker{font:600 11px/1 var(--font-mono);letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);display:inline-flex;align-items:center;gap:8px;margin-bottom:14px}
.kicker:before{content:"";width:10px;height:10px;background:var(--accent);border-radius:2px}
h1{font-size:clamp(33px,8vw,52px);font-weight:900;letter-spacing:-.035em;line-height:1.02;margin:.1em 0 .35em;text-wrap:balance}
h2{font-size:clamp(26px,6.6vw,35px);font-weight:800;letter-spacing:-.03em;line-height:1.13;margin:0 0 18px;text-wrap:balance}
p.lead{font-size:17px;color:var(--ink-soft);margin:0 0 26px}
.opts{display:flex;flex-direction:column;gap:9px;margin-bottom:26px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  padding:14px 16px;color:var(--ink-soft);font:15px/1.4 var(--font-sans);cursor:pointer;transition:.13s}
.opt:hover{border-color:var(--line-2);color:var(--ink)}
.opt .box{width:17px;height:17px;border:1.5px solid var(--line-2);border-radius:5px;flex:0 0 auto;margin-top:1px;
  display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent}
.opt.radio .box{border-radius:50%}
.opt.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.opt.on .box{background:var(--accent);border-color:var(--accent);color:#fff}
.opt .num{font:700 12px var(--font-mono);color:var(--muted);flex:0 0 auto;margin-top:2px}
.opt.on .num{color:var(--accent)}
textarea{width:100%;min-height:110px;font:15px var(--font-sans);color:var(--ink);
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:13px 14px;resize:vertical}
textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.hint{font-size:13px;color:var(--muted);margin:8px 0 24px}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(13,13,9,.94);backdrop-filter:blur(8px);
  border-top:1px solid var(--line);padding:14px 18px}
.navin{max-width:680px;margin:0 auto;display:flex;gap:10px;align-items:center}
.btn{border:none;border-radius:var(--r-pill);padding:13px 24px;font:600 15px var(--font-sans);
  cursor:pointer;transition:.13s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.97)}
.btn,.btn:hover{text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);flex:1}
.btn.primary:hover{background:var(--accent-hover)}
.btn.primary[disabled]{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line-2)}
.btn.lime{background:var(--lime);color:var(--lime-ink);flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);
  padding:20px;box-shadow:var(--shadow);margin:16px 0}
.card.lime{border-color:rgba(212,255,0,.3);background:linear-gradient(180deg,var(--lime-soft),transparent 70%),var(--surface)}
.axes{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.ax{display:flex;align-items:center;gap:12px;font-size:14px}
.ax .n{flex:0 0 108px;color:var(--ink-soft)}
.ax .t{flex:1;height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.ax .t i{display:block;height:100%;background:var(--lime)}
.ax .v{flex:0 0 34px;text-align:right;font:700 12px var(--font-mono);color:var(--muted)}
.gap{font-size:13px;color:var(--muted);margin-top:10px}
.note{border-left:2px solid var(--accent);padding-left:14px;color:var(--ink-soft);font-size:14px;margin:18px 0}
.miss{border:1px dashed var(--line-2);border-radius:var(--r-md);padding:14px 16px;color:var(--muted);font-size:14px;margin-bottom:24px}
svg.radar{display:block;margin:6px auto 0;max-width:100%}
.stack{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tag{font:600 11px var(--font-mono);padding:4px 10px;border-radius:var(--r-sm);
  background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--line)}

/* ---- bridge: classes this survey uses, drawn in the same system ---- */
.eyebrow{font:600 11px/1 var(--font-mono);letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);display:inline-flex;align-items:center;gap:8px;margin-bottom:14px}
.eyebrow:before{content:"";flex:none;width:10px;height:10px;background:var(--accent);border-radius:2px}
.lbl{font:600 11px/1 var(--font-mono);letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);display:inline-flex;align-items:center;gap:8px;margin-bottom:12px}
.lbl:before{content:"";flex:none;width:10px;height:10px;background:var(--accent);border-radius:2px}
.grp{font:600 10px/1 var(--font-mono);letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);margin:20px 0 9px}
.grp:first-child{margin-top:0}
.lede{font-size:17px;color:var(--ink-soft);margin:0 0 26px}
.fancy{font-style:italic;color:var(--accent)}

h3{font-size:19px;font-weight:800;letter-spacing:-.022em;margin:0 0 8px}
p{margin:.6em 0}

.opt{min-height:56px;align-items:center;font-size:15.5px}
.opt.off{opacity:.38}
.opt .box{width:21px;height:21px;font-size:12.5px;font-weight:700;margin-top:0}
.opt.radio .box{font-size:13px}
input.other{width:100%;margin-top:9px;font:15px var(--font-sans);color:var(--ink);
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);
  padding:12px 14px}
input.other:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

.sect{margin-top:36px}
.card.take{border-color:rgba(212,255,0,.3);
  background:linear-gradient(180deg,var(--lime-soft),transparent 70%),var(--surface)}
.key{border-bottom:2px dotted var(--accent);padding-bottom:1px;font-weight:700;color:var(--accent)}
.key.warm{border-bottom-color:var(--lime);color:var(--lime)}
/* промпт: свернут до экрана, разворачивается по кнопке */
.pwrap{position:relative}
.pwrap.cut pre{max-height:230px;overflow:hidden}
.pwrap.cut:after{content:"";position:absolute;left:1px;right:1px;bottom:11px;height:80px;
  pointer-events:none;border-radius:0 0 var(--r-md) var(--r-md);
  background:linear-gradient(rgba(13,13,9,0),var(--bg))}
.more{display:block;font:600 12px var(--font-mono);color:var(--ink-soft);background:none;
  border:0;border-bottom:2px dotted var(--line-2);padding:0 0 2px;margin:0 0 14px;cursor:pointer}
.acts{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.again{display:flex;justify-content:center;margin:34px 0 10px}
.again button{font:600 13px var(--font-mono);color:var(--muted);background:none;border:0;
  border-bottom:2px dotted var(--line-2);padding:0 0 3px;cursor:pointer}

pre{white-space:pre-wrap;font:13px/1.6 var(--font-mono);color:var(--ink-soft);
  background:var(--bg);border:1px solid var(--line);border-radius:var(--r-md);
  padding:15px 16px;margin:14px 0 10px;overflow-x:auto}
.copy{font:600 13px var(--font-sans);background:var(--ink);color:var(--bg);border:none;
  border-radius:var(--r-sm);padding:10px 15px;cursor:pointer}
.copy.ok{background:var(--lime);color:var(--lime-ink)}
.btn.ok{background:var(--lime);color:var(--lime-ink)}
.apply{font-size:15px;color:var(--muted);margin-top:12px}
.give{font-size:15px;color:var(--ink-soft)}
.fin p{font-size:17px;color:var(--ink-soft)}
hr{border:none;border-top:1px solid var(--line);margin:32px 0}
a.link{color:var(--ink);border-bottom:2px dotted var(--accent);text-decoration:none;font-weight:600}

/* bottom bar lifted off the screen edge (mobile home-indicator) */
.nav{padding:18px 18px calc(38px + env(safe-area-inset-bottom,0px))}
main{padding-bottom:176px}
.navin{flex-wrap:wrap;gap:10px}

/* bullet progress inside a multi-page question */
.dots{display:flex;gap:7px;margin:-6px 0 20px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line-2);transition:.2s}
.dots i.done{background:var(--accent-soft)}
.dots i.on{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

.btn{background:var(--accent);color:var(--accent-ink);padding:15px 24px;font-size:15px}
.btn:hover{background:var(--accent-hover)}
.btn.grow{flex:1}
.btn.block{display:flex;width:100%}
.btn.ghost{padding:15px 18px}
.cta{display:flex;justify-content:center;margin:30px 0 4px}
.cta .btn{padding:16px 34px;font-size:16px}

/* key words inside the answer buttons */
.kw{text-decoration:none;font-weight:700;color:var(--accent);
  border-bottom:2px dotted var(--accent);padding-bottom:1px}
.opt.on .kw{color:var(--lime);border-bottom-color:var(--lime)}
.opt.off .kw{color:inherit;border-bottom-color:var(--line-2)}

/* result page: section navigation */
html{scroll-behavior:smooth}
.sect{scroll-margin-top:118px}

/* result page: sticky reading schema (as in «Точка входа») */
body.res main{padding-bottom:150px}
.emp{position:sticky;top:45px;z-index:4;margin:2px -18px 22px;padding:10px 18px 12px;
  background:linear-gradient(var(--bg) 76%,rgba(13,13,9,0))}
.erow{display:flex;gap:6px}
.elay{position:relative;flex:1;min-width:0;min-height:52px;padding:10px 2px 15px;background:none;
  border:0;font-family:inherit;cursor:pointer;text-align:center}
.elay .en{display:block;font:700 10px var(--font-mono);letter-spacing:.06em;color:var(--muted);
  transition:.2s}
.elay .et{display:block;margin-top:3px;font:600 9.5px var(--font-mono);letter-spacing:.01em;
  color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:.2s}
.elay.lit .et{color:var(--ink-soft)}
.elay.cur .et{color:var(--lime)}
.elay:after{content:"";position:absolute;left:0;right:0;bottom:6px;height:4px;
  border-radius:4px;background:var(--line-2);transition:.2s}
.elay.lit:after{background:var(--accent);opacity:.5}
.elay.lit .en{color:var(--ink-soft)}
.elay.cur:after{background:var(--lime);opacity:1}
.elay.cur .en{color:var(--lime)}
.emp-now{display:flex;align-items:baseline;gap:9px;margin-top:-2px}
.emp-now .k{font:600 10px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);flex:none}
.emp-now .v{font-size:13.5px;font-weight:700;letter-spacing:-.01em}
.emp-now .v i{font-style:normal;font-weight:500;color:var(--ink-soft)}

/* примеры ответа под полем ввода */
.exs{display:flex;flex-direction:column;gap:8px;margin:12px 0 4px}
.ex{display:flex;align-items:center;gap:11px;width:100%;text-align:left;min-height:50px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  padding:12px 14px;font:15px var(--font-sans);color:var(--ink-soft);cursor:pointer}
.ex:active{transform:scale(.995)}
.ex .plus{flex:none;font:700 15px var(--font-mono);color:var(--accent)}
.ex.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}

/* сводка ответов */
.sum{border:1px solid var(--line);border-radius:var(--r-card);background:var(--surface);
  padding:15px 16px 6px;margin:14px 0 18px}
.sum .srow{display:flex;align-items:baseline;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.sum .srow:first-child{border-top:0}
.sum .sk{flex:none;width:92px;font:600 10px var(--font-mono);letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted)}
.sum .sv{font-size:14.5px;font-weight:600;line-height:1.3;letter-spacing:-.01em}

/* возражение */
.obj{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--r-md);
  background:var(--surface);padding:14px 16px;margin:0 0 11px}
.obj h4{font-size:16.5px;font-weight:800;letter-spacing:-.02em;line-height:1.25;margin:0 0 7px}
.obj p{font-size:15px;line-height:1.45;color:var(--ink-soft);margin:.5em 0 0}
.obj p:first-of-type{margin-top:0}
.obj b{color:var(--ink);font-weight:700}

/* подобранный материал */
.mat{display:block;border:1px solid var(--line-2);border-radius:var(--r-md);background:var(--surface);
  padding:14px 16px;margin:0 0 10px;text-decoration:none;color:inherit}
.mat .mn{display:block;font-size:16px;font-weight:800;letter-spacing:-.02em;margin-bottom:5px}
.mat .md{display:block;font-size:14.5px;line-height:1.4;color:var(--ink-soft)}
.mat .mw{display:block;margin-top:9px;font:600 11px var(--font-mono);letter-spacing:.04em;
  color:var(--lime)}
/* v11 */
.mats3{display:flex;gap:10px;overflow-x:auto;margin:4px -20px 6px;padding:2px 20px 10px;
  scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.mats3 .mat{flex:0 0 80%;max-width:300px;margin:0;scroll-snap-align:start}
.steps3{display:flex;flex-direction:column;gap:11px;margin:8px 0 20px}
.s3i{display:flex;flex-direction:column;gap:3px;border-left:3px solid var(--lime);padding:2px 0 2px 14px}
.s3i .s3n{font:700 11px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--lime)}
.s3i .s3v{font-size:15px;line-height:1.4;color:var(--ink-soft)}
.lvl{margin:12px 0 4px}
.lvl p{font-size:15.5px;line-height:1.5;color:var(--ink-soft);margin:0 0 13px}
.lvl .pull{color:var(--ink);margin-top:0}
.lvl .key{color:var(--lime);font-weight:800}
.note{border-left:3px solid var(--accent);padding:2px 0 2px 15px;margin:0 0 24px;
  font-size:14.5px;line-height:1.5;color:var(--ink-soft)}
.note b{color:var(--ink);font-weight:700}
.cta2{display:flex;flex-direction:column;gap:10px;margin:26px 0 4px}
.chaos{margin-top:24px;border-top:1px solid var(--line);padding-top:22px}
.chaos p{font-size:15.5px;line-height:1.5;color:var(--ink-soft);margin:0}
.opt.nudge{border-color:var(--lime);background:var(--lime-soft)}
.opt.nudge:not(.on) .box{border-color:var(--lime);color:transparent}
.opt.nudge.on{border-color:var(--lime);background:var(--lime-soft)}
.opt.nudge.on .box{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.nudge-cap{font-size:13px;color:var(--lime);font-weight:600;margin:2px 0 12px}
/* Q3 «ничего из этого пока» — только чекбокс + текст, без контейнера, без цвета */
.opt.bare{background:none;border:0;border-radius:0;padding:12px 2px;min-height:auto;color:var(--ink-soft)}
.opt.bare:hover{background:none;color:var(--ink)}
.opt.bare.on{background:none;border:0;color:var(--ink)}
.opt.bare .box{border-color:var(--line-2);background:none;color:transparent}
.opt.bare.on .box{background:var(--ink-soft);border-color:var(--ink-soft);color:var(--bg)}

/* result page: одна цитата на разрыв + список незакрытого */
.pull{font-size:18.5px;font-weight:800;letter-spacing:-.02em;line-height:1.26;
  border-left:3px solid var(--accent);padding-left:15px;margin:14px 0 16px;text-wrap:balance}
.pull .key{font-weight:800;color:inherit;border:none}
.todo{display:flex;flex-direction:column;gap:8px;margin:10px 0 4px}
.titem{display:flex;align-items:flex-start;gap:11px;border:1px solid var(--line);
  border-radius:var(--r-md);background:var(--surface);padding:11px 13px;
  font-size:14.5px;line-height:1.35;color:var(--ink-soft)}
.titem .bx{flex:none;width:16px;height:16px;border:1.5px solid var(--line-2);
  border-radius:4px;margin-top:2px}
.titem.done{color:var(--muted)}
.titem.done .bx{background:var(--lime);border-color:var(--lime);
  display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--lime-ink)}
.tabs{display:flex;gap:7px;width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;font:600 12px var(--font-mono);letter-spacing:.04em;padding:9px 14px;
  border:1px solid var(--line-2);border-radius:var(--r-pill);color:var(--ink-soft);
  text-decoration:none;white-space:nowrap}
.tabs a:hover{border-color:var(--accent);color:var(--ink)}

/* result page: infographics */
.ladder{display:flex;flex-direction:column;gap:8px;margin:14px 0 16px}
.rung{display:flex;align-items:flex-start;gap:12px;padding:13px 15px;border:1px solid var(--line);
  border-radius:var(--r-md);background:var(--surface);color:var(--muted);font-size:15px}
.rung .rn{font:700 11px var(--font-mono);color:var(--muted);flex:none;margin-top:3px}
.rung .rlab{display:flex;flex-direction:column;gap:3px;min-width:0}
.rung .rnm{font-weight:600;line-height:1.2}
.rung .rd{font-size:12.5px;line-height:1.36;color:var(--muted);font-weight:400}
.rung.on .rd{color:var(--ink-soft)}
.rung.goal .rd{color:var(--muted)}
/* раскрываемые уровни: тап по ступени разворачивает полный текст */
.lvlrow{display:flex;flex-direction:column}
.lvlrow .rung{cursor:pointer;user-select:none}
.rmeta{margin-left:auto;display:flex;align-items:center;gap:9px;flex:none}
.chev{color:var(--muted);font-size:12px;transition:transform .25s;line-height:1}
.lvlrow.open .chev{transform:rotate(90deg)}
.rpanel{max-height:0;overflow:hidden;transition:max-height .35s ease;margin-left:6px;
  border-left:2px solid var(--line-2)}
.lvlrow.open .rpanel{max-height:1600px}
.rpanel .inner{padding:11px 2px 8px 15px}
.rpanel p{margin:0 0 9px;font-size:13.5px;line-height:1.52;color:var(--ink-soft)}
.rpanel p:last-child{margin-bottom:0}
.rpanel .key{font-weight:700;color:var(--ink)}
.rpanel a.link{color:var(--accent);border-bottom:1px solid rgba(233,30,99,.4)}
.lvlrow.open .rung.on{border-color:var(--accent)}
.rung.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:700}
.rung.on .rn{color:var(--accent)}
.rung .rt{margin-left:auto;font:700 10px var(--font-mono);letter-spacing:.1em;
  text-transform:uppercase;color:var(--accent-ink);background:var(--accent);
  padding:3px 9px;border-radius:var(--r-pill)}
.axes{display:flex;flex-direction:column;gap:11px;margin:14px 0 10px}
.ax{display:grid;grid-template-columns:minmax(84px,110px) 1fr 38px;align-items:center;gap:11px}
.axn{font:600 11px var(--font-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.axb{height:9px;background:var(--surface-2);border-radius:var(--r-pill);overflow:hidden}
.axb i{display:block;height:100%;background:var(--lime);border-radius:var(--r-pill)}
.axv{font:700 11px var(--font-mono);color:var(--muted);text-align:right}
.ax.gap .axn{color:var(--accent)}
.ax.gap .axb i{background:var(--accent)}
.ax.gap .axv{color:var(--accent)}
.btn.ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line-2)}
.btn.ghost:hover{background:transparent;color:var(--ink)}
.btn.sky{background:var(--lime);color:var(--lime-ink)}
.btn.sky:hover{background:var(--lime)}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn .go{font-size:18px;opacity:.8}

/* v12: гайды-таймлайн */
.tl{display:flex;flex-direction:column;gap:10px;margin:12px 0 8px}
.tl .ti{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--line);
  border-radius:var(--r-md);background:var(--surface);padding:14px 16px;
  text-decoration:none;color:inherit;transition:.13s}
.tl .ti:hover{border-color:var(--line-2)}
.tl .tin{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent);
  color:#fff;font:800 14px/30px var(--font-mono);text-align:center}
.tl .tib{display:flex;flex-direction:column;gap:3px;min-width:0}
.tl .tit{font-size:16px;font-weight:800;letter-spacing:-.02em}
.tl .tid{font-size:14px;line-height:1.4;color:var(--ink-soft)}
/* v12: подписка */
.subs{margin-top:26px}
.subs .give{margin:0 0 12px}
/* v12: шкала — ступень-цель */
.rung.goal{border-style:dashed;border-color:var(--lime);color:var(--ink-soft)}
.rung.goal .rn{color:var(--lime)}
.rung .rt.goal{background:var(--lime);color:var(--lime-ink)}
/* v13: неакцентный «пропустить» под вопросом */
.skip{display:flex;justify-content:center;margin:18px 0 2px}
.skip button{font:600 13px var(--font-mono);color:var(--muted);background:none;border:0;
  border-bottom:2px dotted var(--line-2);padding:0 0 3px;cursor:pointer}
.skip button:hover{color:var(--ink-soft)}
/* v12: CTA «что дальше» по центру */
.nextcta{text-align:center;margin-top:30px}
.nextcta h2{margin-bottom:10px}
.nextcta .ncs{font-size:17px;font-weight:800;color:var(--ink);letter-spacing:-.02em;margin:0 0 12px}
.nextcta p{font-size:16px;color:var(--ink-soft);line-height:1.5}
.nextcta .cta{margin:22px 0 14px}
.nextcta .ncf{font-size:15px;color:var(--muted);margin-top:12px}

/* practic (si===2) rich narrative — v15 */
.pr2 h3{font-size:20px;font-weight:800;letter-spacing:-.022em;margin:28px 0 10px;color:var(--accent)}
.pr2 p{font-size:15.5px;line-height:1.55;color:var(--ink-soft);margin:0 0 13px}
.pr2 .callout{border-left:3px solid var(--accent);padding:2px 0 2px 16px;margin:16px 0 20px}
.pr2 .callout b{display:block;color:var(--ink);font-size:17px;line-height:1.4;margin-bottom:12px}
.pr2 .callout ul{margin:0;padding-left:18px;list-style:none}
.pr2 .callout li{position:relative;color:var(--ink-soft);font-size:15px;line-height:1.5;margin-bottom:10px;padding-left:14px}
.pr2 .callout li:before{content:"—";position:absolute;left:-2px;color:var(--accent)}
.pr2 .box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:20px;margin:20px 0}
.pr2 .box>h3:first-child{margin-top:0}
.pr2 .quote{border-left:3px solid var(--lime);padding:7px 0 7px 15px;margin:14px 0;font-style:italic;color:var(--ink-soft);font-size:14px;line-height:1.45}
/* «пропущен фундамент» — залитый контейнер, без жирного */
.foundation{background:var(--accent-soft);border:1px solid rgba(233,30,99,.28);border-radius:var(--r-md);
  padding:13px 15px;margin:14px 0 12px;font-size:15.5px;line-height:1.4;color:var(--ink);font-weight:400;text-wrap:balance}
.foundation .key{font-weight:600;color:var(--accent)}
/* подсказка-тап под заголовком шкалы */
.hint{font-size:12.5px;color:var(--muted);margin:2px 0 12px;font-style:italic}
.pr2 .blk{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-card);padding:20px;margin:20px 0}
.pr2 .blk p:last-child{margin-bottom:0}
.pr2 .cta-consult{display:block;text-align:center;margin:24px 0 6px}


/* «в конце» — обещание-награда: лаймовый чип, не розовое предупреждение */
.note.win{border-left:none;background:var(--lime-soft);border:1px solid rgba(212,255,0,.32);
  border-radius:var(--r-md);padding:11px 14px;display:flex;gap:9px;align-items:baseline}
.note.win b{color:var(--lime);text-transform:uppercase;letter-spacing:.04em;font-size:12px;
  font-family:'JetBrains Mono',monospace;white-space:nowrap}

/* --- «Путь» переработан в план действий: карта-карточка на ступень --- */
.plan{display:flex;flex-direction:column;gap:12px;margin:18px 0 8px}
.pc{border:1px solid var(--line);border-radius:var(--r-card);background:var(--surface);padding:16px 17px}
.pc.pivot{border-color:rgba(212,255,0,.35);background:linear-gradient(180deg,var(--lime-soft),transparent 72%),var(--surface)}
.pc.goal{border-style:dashed}
.pchead{display:flex;align-items:center;gap:11px;margin-bottom:8px}
.pcn{flex:none;width:26px;height:26px;border-radius:7px;background:var(--accent);color:#fff;
  font:800 12px/26px var(--font-mono);text-align:center}
.pc.pivot .pcn{background:var(--lime);color:var(--lime-ink)}
.pct{font-size:17px;font-weight:800;letter-spacing:-.02em;color:var(--ink);flex:1;line-height:1.18}
.mode{flex:none;font:600 9.5px/1 var(--font-mono);letter-spacing:.04em;text-transform:uppercase;
  padding:5px 9px;border-radius:var(--r-pill);border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
.mode.solo{border-color:var(--accent);color:var(--accent)}
.mode.hard{border-color:var(--line-2);color:var(--ink-soft)}
.mode.goal{border-color:var(--lime);color:var(--lime)}
.why{font-size:13.5px;line-height:1.45;color:var(--muted);font-style:italic;margin:0 0 10px}
.pc p.act{font-size:14.5px;line-height:1.5;color:var(--ink-soft);margin:0 0 10px}
.discl{font:600 12px/1.5 var(--font-mono);color:var(--muted);margin:0 0 11px}
.discl b{color:var(--ink-soft);font-weight:600}
.qs{list-style:none;margin:2px 0 11px;padding:0;display:flex;flex-direction:column;gap:8px}
.qs li{position:relative;padding-left:18px;font-size:14px;line-height:1.4;color:var(--ink-soft)}
.qs li:before{content:"—";position:absolute;left:0;color:var(--lime)}
.out{display:flex;gap:9px;align-items:flex-start;border-top:1px solid var(--line);padding-top:11px;
  font-size:14px;line-height:1.45}
.out .ol{flex:none;font:700 9.5px/1.5 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;
  color:var(--lime)}
.out .ov{color:var(--ink-soft)}
.tasks{display:flex;flex-direction:column;gap:8px;margin:4px 0 11px}
.tk{border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface-2);padding:12px 14px}
.tk .th{font-size:14.5px;font-weight:700;color:var(--ink);letter-spacing:-.01em;line-height:1.3}
.tk .th .tnum{font:800 11px var(--font-mono);color:var(--accent);margin-right:7px}
.tk .td{font-size:13.5px;line-height:1.4;color:var(--ink-soft);margin-top:4px}
.tk .ts{display:block;margin-top:7px;font:600 12.5px var(--font-sans);color:var(--lime)}
.pathnote{font-size:13px;line-height:1.5;color:var(--muted);
  border:1px dashed var(--line-2);border-radius:var(--r-md);padding:11px 13px;margin:2px 0 0}
.close{border:1px solid rgba(212,255,0,.3);border-radius:var(--r-card);
  background:linear-gradient(180deg,var(--lime-soft),transparent 70%),var(--surface);
  padding:20px;margin:18px 0 8px}
.close p{font-size:15px;line-height:1.55;color:var(--ink-soft);margin:0 0 12px}
.close .duo{font-size:16.5px;font-weight:800;letter-spacing:-.02em;color:var(--ink);line-height:1.42}
.close .duo b{color:var(--lime)}
.phase{font:600 10px/1 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin:20px 0 2px}
.phase:first-child{margin-top:4px}
/* --- accent underlines for key phrases (как в .kw / a.link) --- */
.hl{border-bottom:2px dotted var(--accent);font-weight:600;color:var(--ink);padding-bottom:1px}
.hlL{border-bottom:2px dotted var(--lime);font-weight:600;color:var(--ink);padding-bottom:1px}
.pc .act .hl,.pc .why .hl{color:inherit}
/* --- hook line above the scale (bывший вводный pull) --- */
.hook{font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.32;color:var(--ink);
  border-left:3px solid var(--accent);padding:3px 0 3px 16px;margin:2px 0 24px}
.hook b{color:var(--accent)}
/* --- инфографика: со мной vs сам --- */
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 0}
.vs .col{border:1px solid var(--line-2);border-radius:var(--r-md);padding:15px 16px}
.vs .col.me{border-color:rgba(212,255,0,.45);background:var(--lime-soft)}
.vs .ch{display:flex;align-items:center;gap:7px;font:700 11px/1 var(--font-mono);
  letter-spacing:.06em;text-transform:uppercase;margin-bottom:9px;color:var(--muted)}
.vs .col.me .ch{color:var(--lime)}
.vs .dot{width:7px;height:7px;border-radius:2px;background:var(--muted)}
.vs .col.me .dot{background:var(--lime)}
.vs .ct{font-size:14px;line-height:1.45;color:var(--ink-soft)}
.vs .col.me .ct{color:var(--ink)}
@media(max-width:430px){.vs{grid-template-columns:1fr}}
/* --- инфографика: трансформация «было → станет» --- */
.xform{display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0 0;
  padding:9px 13px;border:1px solid var(--line-2);border-radius:var(--r-pill);
  font:600 13px/1 var(--font-mono)}
.xform .fr{color:var(--muted)}
.xform .ar{color:var(--lime);font-weight:700}
.xform .to{color:var(--ink);border-bottom:2px solid var(--lime);padding-bottom:2px}

/* ===== v17: restored mobile section-nav + step checklists + bridges ===== */
.resnav{position:sticky;top:53px;z-index:4;margin:0 -18px 22px;padding:11px 18px 12px;
  background:linear-gradient(var(--bg) 80%,rgba(13,13,9,0))}
.resnav .tabs a.cur{border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}
.sect{scroll-margin-top:124px}
/* «Краткий план» — компактный нумерованный чеклист */
.krat{counter-reset:k;list-style:none;margin:14px 0 8px;padding:0}
.krat li{counter-increment:k;position:relative;padding:11px 0 11px 42px;font-size:15px;
  line-height:1.4;color:var(--ink-soft);border-top:1px solid var(--line)}
.krat li:first-child{border-top:0}
.krat li:before{content:counter(k);position:absolute;left:0;top:9px;width:27px;height:27px;
  border-radius:7px;background:var(--surface-2);border:1px solid var(--line-2);
  font:800 12px/27px var(--font-mono);text-align:center;color:var(--lime)}
/* пошаговый план — чекбокс-пункты внутри карточки */
.chk{list-style:none;margin:9px 0 4px;padding:0;display:flex;flex-direction:column;gap:9px}
/* блок, а не flex: во flex каждое слово рядом с <span> становится отдельным элементом
   и между фрагментами строки появляются лишние отступы */
.chk li{display:block;position:relative;padding-left:28px;font-size:14.5px;line-height:1.42;color:var(--ink-soft)}
.chk li{cursor:pointer;user-select:none;transition:color .15s}
.chk li:before{content:"";position:absolute;left:0;top:2px;width:17px;height:17px;border:1.5px solid var(--line-2);
  border-radius:4px;background:var(--surface-2);transition:background .15s,border-color .15s;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--lime-ink);line-height:1}
.chk li:hover:before{border-color:var(--lime)}
.chk li.done{color:var(--ink)}
.chk li.done:before{content:"\2713";background:var(--lime);border-color:var(--lime)}
.pc .exs-note{font-size:13.5px;line-height:1.5;color:var(--muted);margin:10px 0 0;
  border-top:1px solid var(--line);padding-top:11px}
.pc .exs-note b{color:var(--ink-soft);font-weight:600}
/* логическая связка между блоками */
.bridge{display:flex;align-items:flex-start;gap:12px;margin:26px 0 6px;color:var(--muted);
  font-size:14.5px;line-height:1.45;font-style:italic}
.bridge:before{content:"\2193";font-style:normal;font-weight:800;color:var(--accent);
  font-size:17px;line-height:1.4;flex:none}
/* «применение в твоей сфере» — карточки юзкейсов под ответ Q9 */
.ucsub{margin:12px 0 0;font-size:14px;line-height:1.45;color:var(--muted)}
.ucsub b{color:var(--ink);font-weight:600}
.ucs{counter-reset:u;display:flex;flex-direction:column;gap:9px;margin:14px 0 0;padding:0;list-style:none}
.ucs li{counter-increment:u;position:relative;padding:13px 15px 13px 47px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md)}
.ucs li:before{content:counter(u);position:absolute;left:14px;top:13px;width:22px;height:22px;
  border-radius:6px;background:var(--surface-2);border:1px solid var(--line-2);
  font:800 11px/22px var(--font-mono);text-align:center;color:var(--lime)}
.uct{display:block;font-size:15px;line-height:1.38;font-weight:600;color:var(--ink)}
.ucp{display:block;margin-top:6px;font-size:13.5px;line-height:1.45;color:var(--muted)}
:root[data-theme="light"] .ucs li:before{color:var(--limeT)}
/* краткий вывод-строка на разрыв (мостик перед планом) */
.pr2 .blk.plain{background:var(--surface-2)}
/* манифест: каждый тезис — отдельной центрированной карточкой */
.mnf{display:flex;flex-direction:column;gap:9px;margin:6px 0 4px}
.mnf p{margin:0;text-align:center;font-size:14px;line-height:1.45;font-weight:400;color:var(--ink-soft);
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:11px 14px}
.mnf p.big{font-size:14.5px;font-weight:600;color:var(--ink);text-align:left;
  background:var(--accent-soft);border-color:rgba(233,30,99,.30)}
.mnf p.core{text-align:left;color:var(--ink);
  background:var(--lime-soft);border-color:rgba(212,255,0,.34)}
.mnf p .hl{border-bottom-color:var(--accent)}
.mnf p.big .hlL{border-bottom-color:var(--lime)}
/* fit-content кнопки + центрирование */
.btn.auto{display:inline-flex;width:auto}
.cta2.center{display:flex;justify-content:center}
/* ============ светлая тема (опция) — переключатель в шапке ============ */
:root[data-theme="light"]{
  --bg:#F4F2EC; --surface:#FBFAF6; --surface-2:#EFEDE4;
  --ink:#141310; --ink-soft:#4A4842; --muted:#8A8578;
  --line:#DEDBD0; --line-2:#CBC7B9; --grid:rgba(0,0,0,.045);
  --accent-soft:rgba(233,30,99,.10); --lime-soft:rgba(140,150,0,.14);
  --shadow:0 1px 3px rgba(0,0,0,.10),0 12px 32px rgba(0,0,0,.10);
}
:root[data-theme="light"] .top{background:rgba(244,242,236,.92);border-bottom-color:var(--line)}
:root[data-theme="light"] .hook{color:var(--ink)}
:root[data-theme="light"] .resnav{background:rgba(244,242,236,.94);border-bottom-color:var(--line)}
:root[data-theme="light"] .resnav a{color:var(--muted)}
:root[data-theme="light"] .nav{background:rgba(244,242,236,.94);border-top-color:var(--line)}
:root[data-theme="light"] .btn.ghost{color:var(--ink);border-color:var(--line-2)}
:root[data-theme="light"] .hlL,:root[data-theme="light"] .mnf p.big .hlL{border-bottom-color:#8C9600}
:root[data-theme="light"] .rpanel .key,:root[data-theme="light"] .rung .rn{color:var(--ink)}
:root[data-theme="light"] .mnf p.big{background:var(--accent-soft);border-color:rgba(233,30,99,.24)}
:root[data-theme="light"] .krat li:before{color:var(--accent-ink)}
:root[data-theme="light"] .quote,:root[data-theme="light"] .core{color:var(--ink-soft)}
/* переключатель темы в шапке */
.tglt{flex:none;width:34px;height:34px;border-radius:var(--r-pill);
  border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink-soft);
  font-size:15px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:border-color .15s,color .15s}
.tglt:hover{border-color:var(--accent);color:var(--ink)}

/* --- светлая тема: дотяжки под остальные блоки опроса --- */
:root[data-theme="light"]{--limeT:#7A8400}
:root[data-theme="light"] .pwrap.cut:after{background:linear-gradient(rgba(244,242,236,0),var(--bg))}
:root[data-theme="light"] .emp{background:linear-gradient(var(--bg) 76%,rgba(244,242,236,0))}
:root[data-theme="light"] .krat li:before,
:root[data-theme="light"] .out .ol,
:root[data-theme="light"] .s3i .s3n,
:root[data-theme="light"] .tk .ts,
:root[data-theme="light"] .qs li:before,
:root[data-theme="light"] .mode.goal,
:root[data-theme="light"] .vs .col.me .ch,
:root[data-theme="light"] .xform .ar,
:root[data-theme="light"] .rung.goal .rn,
:root[data-theme="light"] .lvl .key,
:root[data-theme="light"] .close .duo b,
:root[data-theme="light"] .mat .mw,
:root[data-theme="light"] .nudge-cap,
:root[data-theme="light"] .elay.cur .en,
:root[data-theme="light"] .elay.cur .et,
:root[data-theme="light"] .note.win b{color:var(--limeT)}
:root[data-theme="light"] .opt.on .kw{color:var(--limeT);border-bottom-color:var(--limeT)}
:root[data-theme="light"] .vs .col.me{background:rgba(140,150,0,.10);border-color:rgba(122,132,0,.45)}

if (I_SPH >= 0) Q[I_SPH].catpick = true;

/* sub для входа в вопрос: catpick без выбора → экран категорий (-1) */
function enterSub(n){
  const q = Q[n];
  if (!q) return 0;
  if (q.catpick){
    const v = ans[n];
    if (typeof v === 'number' && q.pages){
      const p = q.pages.findIndex(pp => v >= pp[0] && v < pp[1]);
      return p >= 0 ? p : -1;
    }
    return -1;
  }
  return 0;
}

  'зачем мне платная подписка','какой ии выбрать','как оплатить'];

function kw(t){
  let best = '', at = -1;
  for (const w of KW){
    const p = t.indexOf(w);
    if (p >= 0 && w.length > best.length){ best = w; at = p; }
  }
  return at < 0 ? t
    : t.slice(0, at) + '<u class="kw">' + best + '</u>' + t.slice(at + best.length);
}

// задача по вопросу «чем занят большую часть дня» → колонка карты материалов

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function pageCount(n){ const q = Q[n]; return q && q.pages ? q.pages.length : 1; }

function head(){
  const done = i < 0 ? 0 : i + (pageCount(i) > 1 ? Math.max(0, sub) / pageCount(i) : 0);
  prog.style.width = (done / Q.length * 100) + '%';
  cnt.textContent = i < 0 ? '' : (i + 1) + '/' + Q.length;
}

function render(){
  window.onscroll = null;
  document.body.classList.remove('res');
  if (i < 0) return intro();
  if (i >= Q.length) return final();
  const q = Q[i], cur = ans[i];
  const nn = n => (n < 10 ? '0' : '') + n;
  let body = '<span class="kicker">вопрос ' + nn(i + 1) + ' · ' + nn(Q.length) + '</span>' +
    '<h2>' + esc(q.t) + '</h2>';
  if (q.pages && !q.catpick) body += '<div class="dots">' + q.pages.map((p, n) =>
    '<i class="' + (n === sub ? 'on' : (n < sub ? 'done' : '')) + '"></i>').join('') + '</div>';
  if (q.hint) body += '<p class="hint">' + esc(q.hint) + '</p>';

  /* catpick: экран выбора категории (sub < 0) */
  if (q.catpick && sub < 0){
    body += '<div class="opts">' + q.groups.map(g => {
      const p = q.pages.findIndex(pp => pp[0] === g[0]);
      return '<button class="opt radio catbtn" data-p="' + p + '">' +
        '<span class="box">✱</span><span>' + esc(g[1]) + '</span></button>';
    }).join('') + '</div>';
    if (q.other) body += '<input class="other" id="oth" placeholder="свой вариант" value="' +
      esc(ans['oth' + i] || '') + '">';
    body += '<div class="skip"><button id="skipq">пропустить</button></div>';
    screen.innerHTML = body;
    screen.querySelectorAll('.catbtn').forEach(b => b.onclick = () => {
      sub = +b.dataset.p; render();
    });
    const oth = document.getElementById('oth');
    if (oth) oth.oninput = e => {
      ans['oth' + i] = e.target.value;
      if (e.target.value.trim()) delete ans[i];   // вписал свой вариант → выбор пункта слетает
      navBtns();
    };
    document.getElementById('skipq').onclick = () => {
      delete ans[i]; delete ans['oth' + i];       // пропуск: очищаем и категорию, и свое поле
      i++; sub = enterSub(i); render();
    };
    navBtns();
    head();
    window.scrollTo(0,0);
    return;
  }

  if (q.type === 'text'){
    body += '<textarea id="ta" placeholder="в двух словах, своими словами">' +
      esc(cur || '') + '</textarea>';
    if (q.ex) body += '<div class="grp">примеры — нажми, чтобы подставить</div><div class="exs">' +
      q.ex.map((e,k) => '<button class="ex' + (cur === e ? ' on' : '') + '" data-e="' + k + '">' +
        '<span class="plus">+</span><span>' + esc(e) + '</span></button>').join('') + '</div>';
    screen.innerHTML = body;
    const ta = document.getElementById('ta');
    ta.oninput = e => { ans[i] = e.target.value; screen.querySelectorAll('.ex')
      .forEach(b => b.classList.remove('on')); navBtns(); };
    screen.querySelectorAll('.ex').forEach(b => b.onclick = () => {
      ans[i] = q.ex[+b.dataset.e];
      ta.value = ans[i];
      screen.querySelectorAll('.ex').forEach(x => x.classList.toggle('on', x === b));
      navBtns();
    });
  } else {
    const multi = q.type === 'multi';
    const chosen = multi ? (cur || []) : (cur === undefined ? [] : [cur]);
    const full = multi && q.max && chosen.length >= q.max;
    const from = q.pages ? q.pages[sub][0] : 0;
    const to = q.pages ? q.pages[sub][1] : q.o.length;
    const kwf = q.nokw ? (t => t) : kw;
    const optBtn = (k, extra) => {
      const on = chosen.includes(k);
      const off = full && !on;
      const bare = k === q.pin;   // Q3 «ничего из этого пока»: только чекбокс + текст, без контейнера
      let pre = '';
      if (q.groups && !bare){ const g = q.groups.find(g => g[0] === k); if (g) pre = '<div class="grp">' + g[1] + '</div>'; }
      return pre + '<button class="opt' + (multi ? '' : ' radio') + (on ? ' on' : '') +
        (off ? ' off' : '') + (bare ? ' bare' : (q.hi === k ? ' nudge' : '')) + (extra || '') + '" data-k="' + k + '">' +
        '<span class="box">' + (multi ? '✓' : '✱') + '</span><span>' + (bare ? esc(q.o[k]) : kwf(esc(q.o[k]))) + '</span></button>';
    };
    let opts = q.o.slice(from, to).map((o, j) => optBtn(from + j, '')).join('');
    // Q3: «ничего из этого пока» закреплено на всех страницах — на страницах,
    // где его нет в срезе, добавляем (bare-стиль применяется внутри optBtn).
    if (q.pin !== undefined && (q.pin < from || q.pin >= to)) opts += optBtn(q.pin, '');
    body += '<div class="opts">' + opts + '</div>';
    if (q.other) body += '<input class="other" id="oth" placeholder="свой вариант" value="' +
      esc(ans['oth' + i] || '') + '">';
    screen.innerHTML = body;
    screen.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      const k = +b.dataset.k;
      if (multi){
        let arr = (ans[i] || []).slice();
        const p = arr.indexOf(k);
        if (p >= 0) arr.splice(p,1);
        else {
          // «ничего из этого пока» не стирает уже отмеченные пункты (Kris 27/07);
          // но выбор реального пункта снимает взаимоисключающее «ничего»
          if (q.reset !== undefined && k !== q.reset){
            arr = arr.filter(x => x !== q.reset);
          }
          if (q.max && arr.length >= q.max) return;
          arr.push(k);
        }
        ans[i] = arr;
      } else ans[i] = k;
      render();
    });
    const oth = document.getElementById('oth');
    if (oth) oth.oninput = e => {
      ans['oth' + i] = e.target.value;
      if (e.target.value.trim()){                    // свой вариант → выбор слетает
        delete ans[i];
        screen.querySelectorAll('.opt.on').forEach(x => x.classList.remove('on'));
        navBtns();
      }
    };
  }
  navBtns();
  head();
  window.scrollTo(0,0);
}

function navBtns(){
  const q = Q[i];
  const a = ans[i];
  const cat = q.catpick;
  const onPicker = cat && sub < 0;
  const hasCustom = q.other && (ans['oth' + i] || '').trim() !== '';
  const chosenOpt = a !== undefined && (!Array.isArray(a) || a.length);
  // для catpick любая страница вариантов = последняя (дальше → следующий вопрос)
  const last = cat ? (sub >= 0) : (sub === pageCount(i) - 1);
  const ok = q.skip || !last || chosenOpt || hasCustom;
  // экран категорий: «дальше» появляется, только если вписан свой вариант или уже выбран пункт
  const hideNext = onPicker && !hasCustom && !chosenOpt;
  nav.innerHTML =
    (i > 0 || sub > 0 ? '<button class="btn ghost" id="back">←</button>' : '') +
    (hideNext ? '' :
      '<button class="btn grow" id="next"' + (ok ? '' : ' disabled') + '>' +
      (q.skip && !a ? 'пропустить' : 'дальше') + ' <span class="go">→</span></button>');
  const b = document.getElementById('back');
  if (b) b.onclick = () => {
    if (cat && sub >= 0){ sub = -1; render(); return; }   // варианты → экран категорий
    if (sub > 0) sub--;
    else { i--; sub = Q[i] && Q[i].catpick ? enterSub(i) : pageCount(i) - 1; }
    render();
  };
  const nx = document.getElementById('next');
  if (nx) nx.onclick = () => {
    if (!ok) return;
    // Q9 (catpick): экран категорий с вписанным своим вариантом → сразу к следующему вопросу
    if (cat && sub < 0){ i++; sub = enterSub(i); render(); return; }
    if (!last) sub++;
    else { i++; sub = enterSub(i); }
    render();
  };
}

/* ---------- scoring ---------- */
function stepIndex(){ const v = ans[I_USE]; return v <= 1 ? 0 : (v <= 3 ? 1 : 2); }

function gapIndex(){
  const done = ans[I_DONE] || [];
  const filled = AXMAP.map(g => g.some(k => done.includes(k)));
  for (let k = 0; k < 5; k++) if (!filled[k]) return k;
  return 4;
}

function taskIndex(){
  const day = ans[I_DAY];
  const goals = ans[I_GOAL] || [];
  if (Array.isArray(goals) && goals.includes(5)) return 4;            // «создать свое» перебивает — это продукт
  return day === undefined ? 3 : TASK[day];
}

function matIndex(){ return gapIndex() * 7 + taskIndex(); }

function showAccess(){
  const pay = ans[I_PAY], geo = ans[I_GEO];
  const block = [3,4,5].includes(pay) || (ans[I_BRAKE] || []).includes(8);
  return block || geo === 0 || geo === 2;
}

/* Q9 пропущен или вписан свой вариант → достраиваем сферу по «чем занят по факту», затем по роли */
const UC_BY_DAY  = [6, 0, 0, 2, 6, 4, 7, 12];  /* индексы ответов Q10 «чем ты занят по факту» */
const UC_BY_ROLE = [0, 0, 0, 6, 12, 0];        /* индексы ответов Q8 «как определишь свою роль» */

function ucIndex(){
  const s = ans[I_SPH];
  if (typeof s === 'number' && USECASES[s]) return s;
  const d = ans[I_DAY];
  if (typeof d === 'number' && UC_BY_DAY[d] != null) return UC_BY_DAY[d];
  const r = ans[I_ROLE];
  if (typeof r === 'number' && UC_BY_ROLE[r] != null) return UC_BY_ROLE[r];
  return 0;
}

/* Подпись над списком: выбранный пункт, своя вписанная сфера или подобранный набор */
function ucSub(idx){
  const own = (ans['oth' + I_SPH] || '').trim();
  if (typeof ans[I_SPH] === 'number' && Q[I_SPH].o[ans[I_SPH]])
    return 'Сфера: <b>' + esc(Q[I_SPH].o[ans[I_SPH]]) + '</b>. Вот что имеет смысл отдать ИИ первым.';
  if (own)
    return 'Своя сфера: <b>' + esc(own) + '</b>. Точного набора под нее нет — ближе всего задачи из «' +
      esc(Q[I_SPH].o[idx]) + '», начни с них.';
  if (typeof ans[I_DAY] === 'number' || typeof ans[I_ROLE] === 'number')
    return 'Сфера не выбрана — набор подобран по тому, чем ты занят: <b>' + esc(Q[I_SPH].o[idx]) +
      '</b>. Вот что имеет смысл отдать ИИ первым.';
  return 'Сфера не выбрана, поэтому набор базовый — <b>' + esc(Q[I_SPH].o[idx]) +
    '</b>. Вот что имеет смысл отдать ИИ первым.';
}

function ucSection(){
  const idx = ucIndex();
  const list = USECASES[idx];
  if (!list) return '';
  return '<div class="sect" id="s-use"><span class="lbl">применение в твоей сфере</span>' +
    '<p class="ucsub">' + ucSub(idx) + '</p>' +
    '<ol class="ucs" id="ucs">' +
      list.map(u => '<li>' +
        '<span class="uct">' + u[0] + '</span>' +
        '<span class="ucp">снимает «' + u[1] + '»</span></li>').join('') +
    '</ol></div>';
}

  h += '<div class="sect nextcta" id="s-cta">' +

  [].slice.call(document.querySelectorAll('.lvlrow')).forEach(row => {

/* ---------- навигация по разделам результата ---------- */
const SECS = [
  ['s-lvl',  'уровень',         'шкала вовлеченности'],
  ['s-miss', 'упущение',        'в чем твое узкое место'],
  ['s-krat', 'краткий план',    'восемь шагов'],
  ['s-use',  'твоя сфера',      'что отдать ии первым'],
  ['s-plan', 'пошаговый план',  'что разобрать на каждом шаге'],
  ['s-mats', 'материалы',       'с чего начать сегодня'],
  ['s-cta',  'дальше',          'настроить ии под себя']
];
let navScroll = null;

function resultNav(){
  const rail   = document.getElementById('rail');
  const list   = document.getElementById('csList');
  const sheet  = document.getElementById('csheet');
  const cbar   = document.getElementById('cbar');
  const cbMain = document.getElementById('cbMain');
  const cbNum  = document.getElementById('cbNum');
  const cbTit  = document.getElementById('cbTitle');
  const cbSub  = document.getElementById('cbSub');
  const cbFill = document.getElementById('cbFill');
  const nn = n => (n < 10 ? '0' : '') + n;

  rail.innerHTML = SECS.map((s, k) =>
    '<button type="button" data-k="' + k + '"><span class="rd"></span>' +
    '<span>' + s[1] + '</span></button>').join('');
  list.innerHTML = SECS.map((s, k) =>
    '<button type="button" data-k="' + k + '"><span class="cn">' + nn(k + 1) + '</span>' +
    '<span>' + s[1] + '</span></button>').join('');

  const railBtns = [].slice.call(rail.querySelectorAll('button'));
  const listBtns = [].slice.call(list.querySelectorAll('button'));

  const closeSheet = () => {
    sheet.classList.remove('open');
    cbar.classList.remove('up');
    cbMain.setAttribute('aria-expanded', 'false');
  };
  const goto = k => {
    const el = document.getElementById(SECS[k][0]);
    if (el) window.scrollTo({ top: el.offsetTop - 66, behavior: 'smooth' });
    closeSheet();
  };
  railBtns.forEach(b => b.onclick = () => goto(+b.dataset.k));
  listBtns.forEach(b => b.onclick = () => goto(+b.dataset.k));

  cbMain.onclick = () => {
    const open = !sheet.classList.contains('open');
    sheet.classList.toggle('open', open);
    cbar.classList.toggle('up', open);
    cbMain.setAttribute('aria-expanded', open ? 'true' : 'false');
  };
  sheet.onclick = e => { if (e.target === sheet) closeSheet(); };
  document.getElementById('csTop').onclick = () => {
    closeSheet();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  function onScroll(){
    const y = window.scrollY + 120;
    let cur = 0;
    for (let k = 0; k < SECS.length; k++){
      const el = document.getElementById(SECS[k][0]);
      if (el && el.offsetTop <= y) cur = k;
    }
    railBtns.forEach((b, k) => b.classList.toggle('cur', k === cur));
    listBtns.forEach((b, k) => {
      b.classList.toggle('cur', k === cur);
      b.classList.toggle('done', k < cur);
    });
    cbNum.textContent = nn(cur + 1) + ' / ' + nn(SECS.length);
    cbTit.textContent = SECS[cur][1];
    cbSub.textContent = SECS[cur][2];
    const max = Math.max(1, document.body.scrollHeight - window.innerHeight);
    cbFill.style.width = Math.min(100, window.scrollY / max * 100) + '%';
  }
  if (navScroll) window.removeEventListener('scroll', navScroll);
  navScroll = onScroll;
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
}

/* ---------- переключатель темы ---------- */
(function(){
  const btn = document.getElementById('tglt');
  const meta = document.querySelector('meta[name="theme-color"]');
  const paint = t => {
    if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
    else document.documentElement.removeAttribute('data-theme');
    /* U+263C — текстовый глиф солнца; у него нет emoji-варианта,
       в отличие от U+2600, который iOS рисует цветной картинкой */
    btn.innerHTML = t === 'light' ? '&#9788;' : '&#9789;';
    btn.setAttribute('aria-label', t === 'light' ? 'включить темную тему' : 'включить светлую тему');
    if (meta) meta.setAttribute('content', t === 'light' ? '#F4F2EC' : '#0D0D09');
  };
  let cur = 'dark';
  try { if (localStorage.getItem('opros_theme') === 'light') cur = 'light'; } catch(e){}
  paint(cur);
  btn.onclick = () => {
    cur = cur === 'light' ? 'dark' : 'light';
    paint(cur);
    try { localStorage.setItem('opros_theme', cur); } catch(e){}
  };
})();

/* ---------- payload: одна плоская строка, версионированная ---------- */
function row(){
  const label = (n, v) => v === undefined ? '' :
    (Array.isArray(v) ? v.map(k => Q[n].o[k]).join(' | ') :
     (typeof v === 'number' ? Q[n].o[v] : v));
  const r = {
    version: VERSION,
    started_at: started,
    finished_at: new Date().toISOString(),
    step: ['наблюдатель','пользователь-новичок','практик-исследователь'][stepIndex()],
    gap: AX[gapIndex()],
    task: TASKNAME[taskIndex()],
    material: 'mat_' + String(matIndex() + 1).padStart(2,'0'),
    material_name: X.mats[matIndex()].name,
    access_shown: showAccess() ? 'да' : 'нет'
  };
  Q.forEach((q, n) => {
    r['q' + (n+1)] = label(n, ans[n]);
    if (q.other) r['q' + (n+1) + '_other'] = ans['oth' + n] || '';
  });
  return r;
}

function send(){
  const payload = row();
  window.__payload = payload;
  if (!ENDPOINT){ console.log('payload (endpoint не подключен):', payload); return; }
  fetch(ENDPOINT, {method:'POST', mode:'no-cors',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(payload)}).catch(e => console.warn('отправка не прошла', e));
}

document.getElementById('home').onclick = () => {
  Object.keys(ans).forEach(k => delete ans[k]);   // логотип = старт заново → чистим ответы
  i = -1; sub = 0; render();
};

/* preview-хук: #practic — прыжок сразу на результат уровня «практик» (только для ревью) */
if (location.hash === '#practic'){ ans[I_USE] = 6; i = Q.length; final(); }
else intro();
